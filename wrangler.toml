name = "anime-master-game-api"
main = "worker/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOM_OBJECTS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[d1_databases]]
binding = "DB"
database_name = "anime_master_game"
database_id = "29c5a6af-b096-4be0-934d-67fbcc0a0520"
migrations_dir = "d1/migrations"

[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "anime-master-game-images"

[images]
binding = "IMAGES"

[triggers]
crons = ["0 0 * * *"]

[vars]
ALLOWED_ORIGIN = "https://anipeek.animaster.dpdns.org"
R2_IMAGE_PREFIX = "question-images"
R2_PUBLIC_BASE_URL = "https://assets.animaster.dpdns.org"
R2_EXISTING_IMAGE_LIMIT = "50"
R2_IMAGE_STORAGE_LIMIT_BYTES = "10737418240"
REMOTE_UPLOAD_IMAGE_MAX_SIZE = "1600"
REMOTE_UPLOAD_IMAGE_QUALITY = "78"
REMOTE_UPLOAD_IMAGE_FORMAT = "image/webp"
REMOTE_IMAGE_PROXY_CANDIDATES = "https://corsproxy.io/?url=,https://api.allorigins.win/raw?url=,https://api.codetabs.com/v1/proxy?quest="

[observability.logs]
enabled = true
invocation_logs = true
